name: Update Cargo Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Windows hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/windows-launcher-startup-crash
          persist-credentials: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve workspace dependencies
        run: cargo update --workspace

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: synchronize Cargo.lock for DX12 backend"
          git push origin HEAD:fix/windows-launcher-startup-crash
