name: Nightly Sync

on:
  schedule:
    - cron: '0 0 * * *'
      timezone: 'Europe/Berlin'

concurrency:
  group: nightly-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fast-forward nightly to main
        run: git push origin HEAD:refs/heads/nightly
      - name: Start nightly build
        run: gh workflow run release.yml --ref nightly