name: Feature Request
description: Suggest an intentional neoOMSI extension beyond OMSI 2
labels: ["enhancement", "scope: extension", "status: untriaged"]
body:
  - type: markdown
    attributes:
      value: |
        neoOMSI is currently prioritising OMSI 2.2.032 compatibility.
        If OMSI 2 already supports the behaviour you are requesting, please use the Bug / Compatibility Report instead.
        Valid extension ideas may be deferred until the relevant subsystem has reached a stable compatibility baseline.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the user or content-author problem, not only the proposed implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Describe what neoOMSI should do.
    validations:
      required: true

  - type: dropdown
    id: omsi
    attributes:
      label: Is this behaviour already available in OMSI 2.2.032?
      options:
        - "No — this is intentionally beyond OMSI 2"
        - "I am not sure"
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Could this change alter existing OMSI behaviour, file semantics or mod compatibility?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds or simpler approaches.
    validations:
      required: false