<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Vehicle dashboard (window.omsi.vehicle)</title>
<style>
  body { margin: 0; width: 800px; height: 480px; background: #101820; color: #e8eef4; font-size: 20px; }
  #head { padding: 12px 20px; background: #1b2836; font-size: 22px; }
  #speed { font-size: 96px; font-weight: bold; padding: 10px 20px; color: #ffb000; }
  .unit { font-size: 28px; color: #8aa0b4; }
  .row { padding: 6px 20px; }
  .lamp { display: inline-block; width: 110px; padding: 8px 0; margin: 4px; background: #1b2836; color: #5c6f80; text-align: center; border-radius: 6px; }
  .on { background: #2e7d32; color: #ffffff; }
  .warn { background: #c62828; color: #ffffff; }
</style>
</head>
<body>
  <div id="head"><span id="num">Bus</span> &nbsp; <span id="stop"></span></div>
  <div id="speed"><span id="kmh">0</span><span class="unit"> km/h</span></div>
  <div class="row" id="lamps"></div>
  <div class="row" id="doors"></div>
<script>
  window.omsi = window.omsi || {};

  // one lamp per status, made once
  var lamps = {};
  function lamp(key, label) {
    var e = document.createElement('div');
    e.className = 'lamp';
    e.textContent = label;
    document.getElementById('lamps').appendChild(e);
    lamps[key] = e;
  }
  function show(key, cls) {
    lamps[key].className = 'lamp' + (cls ? ' ' + cls : '');
  }
  lamp('engine', 'ENGINE');
  lamp('battery', 'BATTERY');
  lamp('parking', 'PARK');
  lamp('stopbrake', 'STOP');
  lamp('left', 'LEFT');
  lamp('right', 'RIGHT');
  lamp('head', 'LIGHTS');

  // omsi.vehicle is the same on every bus; a signal the bus lacks is null / false
  window.omsi.update = function (d) {
    var v = d.vehicle;
    document.getElementById('num').textContent = 'Bus ' + v.info.number;
    document.getElementById('stop').textContent = v.info.nextStop;
    document.getElementById('kmh').textContent = Math.round(Math.abs(v.motion.speedKmh));

    show('engine', v.engine.running ? 'on' : '');
    show('battery', v.battery.on == null ? '' : (v.battery.on ? 'on' : 'warn'));
    show('parking', v.brakes.parking ? 'warn' : '');
    show('stopbrake', v.brakes.stop ? 'warn' : '');
    show('left', v.lights.indicatorLeft ? 'on' : '');
    show('right', v.lights.indicatorRight ? 'on' : '');
    show('head', v.lights.headlights > 0 ? 'on' : '');

    // doors: list[0] is door 1
    var html = 'Doors ';
    for (var i = 0; i < v.doors.list.length; i++) {
      var door = v.doors.list[i];
      html += '<div class="lamp' + (door.isOpen ? ' warn' : '') + '">' + door.number + '</div>';
    }
    document.getElementById('doors').innerHTML = html;
  };
</script>
</body>
</html>
