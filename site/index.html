        <h3>You need the original OMSI&nbsp;2</h3>
        <p>openOMSI contains <b>no game content</b>. It plays on the maps, vehicles and files of an installed
        copy of OMSI&nbsp;2 and <b>does not start without one</b>.</p>
      </div>
    </div>

    <h2 class="section-title">What is openOMSI?</h2>
    <p class="lead">openOMSI is a project to recreate the bus simulator <b>OMSI&nbsp;2</b> from the ground up in
    <b>Rust</b>. Every content format of the original - maps, splines, scenery objects, buses, scripts,
    timetables, HOF files, fonts, weather, tickets, plugins - is supported and loaded
    exactly as OMSI&nbsp;2.2.032 does, so existing maps and mods run unchanged. Underneath it is a new engine:
    64-bit, multithreaded, with a modern renderer.</p>

    <div class="grid">
      <div class="card elevation-1"><span class="material-icons card-icon">extension</span><h3>100% mod compatibility</h3><p>Maps, buses, AI vehicles, scenery and plugins from the community work as they are - no conversion.</p></div>
      <div class="card elevation-1"><span class="material-icons card-icon">speed</span><h3>A modern engine</h3><p>64-bit, no 2&nbsp;GB limit, tile streaming and texture loading on worker threads, Metal / Vulkan / DirectX&nbsp;12.</p></div>
      <div class="card elevation-1"><span class="material-icons card-icon">devices</span><h3>Windows, macOS, Linux, Android</h3><p>Native builds for every platform, released automatically for every change.</p></div>
      <div class="card elevation-1"><span class="material-icons card-icon">smartphone</span><h3>On your phone</h3><p>The full game on Android: on-screen wheel or tilt steering, analog pedals, doors, gearbox and a cab panel - with the same maps, buses and mods. <a href="#/docs/ANDROID">More</a></p></div>
      <div class="card elevation-1"><span class="material-icons card-icon">texture</span><h3>PBR materials</h3><p>Normal, roughness, metalness and occlusion maps beside a texture give mods modern materials, and still work in OMSI&nbsp;2. <a href="#/docs/PBR">More</a></p></div>
      <div class="card elevation-1"><span class="material-icons card-icon">groups</span><h3>Multiplayer</h3><p>LAN sessions and a dedicated server that simulates the whole map without a window.</p></div>
      <div class="card elevation-1"><span class="material-icons card-icon">tune</span><h3>A real launcher</h3><p>Profiles, duties from the timetable, bus and livery preview, settings, one-click mod installs.</p></div>
      <div class="card elevation-1"><span class="material-icons card-icon">code</span><h3>Lua plugins</h3><p>Write plugins in Lua: one text file in <code>plugins/</code>, reloaded as you save it, the same on every platform. <a href="#/docs/PLUGINS">Plugin docs</a>.</p></div>
      <div class="card elevation-1"><span class="material-icons card-icon">description</span><h3>Open formats</h3><p>Every OMSI file format is written down - useful for modders and tool makers too.</p></div>
    </div>
  </div>
</template>

<template id="download">
  <div class="content">
    <h1>Download</h1>
    <div class="card card-warning elevation-2">
      <span class="material-icons card-icon">construction</span>
      <div><h3>Early release: expect bugs</h3><p>openOMSI is in an early stage of development. Things may be missing or broken, and may change between versions. Please report problems on <a href="https://github.com/turbo-devv/openOMSI/issues">GitHub Issues</a>.</p></div>
    </div>
    <div class="card card-warning elevation-2">
      <span class="material-icons card-icon">warning</span>
      <div><h3>OMSI&nbsp;2 is required</h3><p>Install the original OMSI&nbsp;2 first. On the first start, point the launcher to its folder (the one with <code>maps</code> and <code>Vehicles</code>).</p></div>
    </div>
    <p class="lead" id="dl-version">Loading the latest release…</p>
    <div class="grid" id="dl-grid"></div>
    <h2 class="section-title">Installing</h2>
    <ul class="steps">
      <li><b>Windows:</b> unpack the zip anywhere and run <code>openomsi.exe</code>.</li>
      <li><b>Linux:</b> unpack and run <code>./openomsi</code> (Vulkan drivers needed).</li>
      <li><b>Android:</b> install the <code>.apk</code>, allow access to all files, copy the whole OMSI&nbsp;2 folder to <code>openOMSI/OMSI 2</code> on the phone - see <a href="#/docs/ANDROID">Android</a>.</li>
      <li>Mods go into the folder next to the game, or through the launcher's <b>Mods</b> page. The original OMSI&nbsp;2 folder is never changed.</li>
    </ul>
    <p>All versions: <a href="https://github.com/turbo-devv/openOMSI/releases">GitHub Releases</a>. Versions are numbered <code>MAJOR.MINOR.COMMIT</code> - see <a href="#/docs/VERSIONING">Versioning</a>.</p>
  </div>
</template>
