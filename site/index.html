        <h3>You need the original OMSI&nbsp;2</h3>
        <p>neoOMSI contains <b>no game content</b>. It plays on the maps, vehicles and files of an installed
        copy of OMSI&nbsp;2 and <b>does not start without one</b>.</p>
      </div>
    </div>

    <h2 class="section-title">What is neoOMSI?</h2>
    <p class="lead">neoOMSI is an open-source, from-scratch reimplementation of the bus simulator <b>OMSI&nbsp;2</b> in
    <b>Rust</b>. It prioritizes verified behavioral parity with OMSI&nbsp;2.2.032 while replacing the legacy engine
    with a modern, multithreaded 64-bit architecture and native graphics acceleration.</p>

    <div class="grid">
      <div class="card elevation-1">
        <span class="material-icons card-icon">verified</span>
        <h3>Behavioral Parity</h3>
        <p>Targeting OMSI 2.2.032 observable behavior. Community maps, buses, splines, and scripts run as expected without manual conversions.</p>
      </div>
      <div class="card elevation-1">
        <span class="material-icons card-icon">memory</span>
        <h3>Modern 64-Bit Engine</h3>
        <p>Written in Rust: multithreaded tile streaming, background texture decompression, and no arbitrary memory ceilings.</p>
      </div>
      <div class="card elevation-1">
        <span class="material-icons card-icon">brush</span>
        <h3>Modern Graphics</h3>
        <p>Powered by wgpu with native hardware acceleration across DirectX&nbsp;12 (Windows), Metal (macOS), and Vulkan (Linux).</p>
      </div>
      <div class="card elevation-1">
        <span class="material-icons card-icon">devices</span>
        <h3>Cross-Platform</h3>
        <p>Native builds for Windows, macOS, Linux, and Android, built automatically via GitHub Actions.</p>
      </div>
      <div class="card elevation-1">
        <span class="material-icons card-icon">tune</span>
        <h3>Integrated Launcher</h3>
        <p>Scenario setup, duty and timetable selection, vehicle previews, and flexible controller configuration.</p>
      </div>
      <div class="card elevation-1">
        <span class="material-icons card-icon">dns</span>
        <h3>Dedicated Server</h3>
        <p>Headless dedicated server mode for multiplayer sessions, simulating maps and timetables without requiring a GPU.</p>
      </div>
      <div class="card elevation-1">
        <span class="material-icons card-icon">layers</span>
        <h3>Non-Destructive Modding</h3>
        <p>Isolated virtual filesystem overlay. Try, manage, and remove community add-ons without altering original OMSI&nbsp;2 files.</p>
      </div>
      <div class="card elevation-1">
        <span class="material-icons card-icon">code</span>
        <h3>Clean-Room & Open Source</h3>
        <p>Zero proprietary binaries or copyrighted assets. GPL-3.0-or-later licensed with transparent, community-driven development.</p>
      </div>
      <div class="card elevation-1">
        <span class="material-icons card-icon">fact_check</span>
        <h3>Regression Tested</h3>
        <p>Automated CI testing and focused regression coverage to prevent compatibility regressions subsystem by subsystem.</p>
      </div>
    </div>
  </div>

<template id="download">
  <div class="content">
    <h1>Download</h1>
    <div class="card card-warning elevation-2">
      <span class="material-icons card-icon">construction</span>
      <div><h3>Early release: expect bugs</h3><p>neoOMSI is in an early stage of development. Things may be missing or broken, and may change between versions. Please report problems on the <a href="#/issues">Issues</a> page.</p></div>
    </div>
    <div class="card card-warning elevation-2">
      <span class="material-icons card-icon">warning</span>
      <div><h3>OMSI&nbsp;2 is required</h3><p>Install the original OMSI&nbsp;2 first. On the first start, point the launcher to its folder (the one with <code>maps</code> and <code>Vehicles</code>).</p></div>
    </div>
    <p class="lead" id="dl-version">Loading the latest release…</p>
    <div class="grid" id="dl-grid"></div>
    <h2 class="section-title">Installing</h2>
    <ul class="steps">
      <li><b>Windows:</b> unpack the zip into a folder of your own (not <code>Program Files</code>) and run <code>neoomsi.exe</code>. SmartScreen may warn about an unknown app: <i>More info</i> → <i>Run anyway</i>. Not sure which one? Almost every PC is <b>x64</b>; <b>ARM</b> is only for Snapdragon laptops.</li>
      <li><b>macOS:</b> unpack and open <code>neoOMSI.app</code>. The first time macOS may refuse an app from the internet: right-click → <i>Open</i> → <i>Open</i>, or run <code>xattr -dr com.apple.quarantine neoOMSI.app</code> once. <b>Apple silicon</b> for M1 and newer, <b>Intel</b> for older Macs.</li>
      <li><b>Linux:</b> unpack and run <code>./neoomsi</code> (<code>chmod +x neoomsi</code> if it does not start; Vulkan or OpenGL drivers needed).</li>
      <li><b>Android:</b> install the <code>.apk</code>, allow access to all files, copy the whole OMSI&nbsp;2 folder to <code>neoOMSI/OMSI 2</code> on the phone.</li>
      <li><b>Dedicated server:</b> only for hosting a multiplayer session without playing on that machine - to play, take the game above. See <a href="#/docs/SERVER">Dedicated server</a>.</li>
      <li>Mods go into the folder next to the game, or through the launcher's <b>Mods</b> page. The original OMSI&nbsp;2 folder is never changed.</li>
    </ul>
    <p>All versions: <a href="#/releases">Releases</a>. See <a href="#/docs/RELEASING">Releasing & versioning</a>.</p>
  </div>
</template>
